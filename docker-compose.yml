
services:
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: soc-tutor-rag-api
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - CHROMA_HOST=chromadb
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4318/v1/traces
    volumes:
      - ./data:/app/data:ro
    # Security Hardening (Principio de Mínimos Permisos)
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/data/sessions:uid=1001,gid=1001
      - /app/logs:uid=1001,gid=1001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - soc-tutor-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: soc-tutor-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/indices:/data
    restart: unless-stopped
    networks:
      - soc-tutor-net

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: soc-tutor-phoenix
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
    networks:
      - soc-tutor-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-tutor-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    # Security Hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - soc-tutor-net

networks:
  soc-tutor-net:
    name: soc-tutor-network